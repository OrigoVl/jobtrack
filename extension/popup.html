<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zorya Job Clipper</title>
    <style>
      /* Same design-token palette as the app (client/src/index.css) — hardcoded hex here since an
         extension popup can't share the app's CSS bundle, and this is a handful of rules, not
         worth a build step for. System font stack, not the app's self-hosted Bricolage
         Grotesque/Public Sans/JetBrains Mono: a popup can't load /fonts/*.woff2 (different
         origin, no web_accessible_resources entry), so naming a font here that can't actually
         load would just be silently ignored in favor of the fallback anyway. */
      body {
        margin: 0;
        width: 320px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #faf9f6;
        color: #171416;
      }
      header {
        padding: 12px 14px;
        border-bottom: 1px solid #ece7e0;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #171416;
      }
      main {
        padding: 14px;
      }
      .field {
        margin-bottom: 10px;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6b6560;
        margin-bottom: 2px;
      }
      .value {
        font-size: 13px;
        word-break: break-word;
      }
      #confidence.high {
        color: #1a7350;
      }
      #confidence.low {
        color: #312a96;
      }
      #url {
        font-size: 11px;
        color: #6b6560;
        word-break: break-all;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 999px;
        background: #4338ca;
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: #ece7e0;
        color: #171416;
        margin-top: 8px;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #6b6560;
        min-height: 16px;
      }
      #originHint {
        margin-top: 10px;
        font-size: 11px;
        color: #b45309;
      }
      #originHint a {
        color: inherit;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>Zorya Job Clipper</header>
    <main>
      <div class="field">
        <div class="label">Position</div>
        <div class="value" id="title">Detecting…</div>
      </div>
      <div class="field">
        <div class="label">Company</div>
        <div class="value" id="company">—</div>
      </div>
      <div class="field">
        <div class="label" id="confidence">—</div>
      </div>
      <div class="field">
        <div class="label">Page</div>
        <div id="url"></div>
      </div>
      <button id="save" disabled>Save to Zorya</button>
      <button id="fill" class="secondary" disabled>Fill application</button>
      <div id="status"></div>
      <div id="originHint" hidden></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
