<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DevRadar Job Clipper</title>
    <style>
      /* Same design-token palette as the app (client/src/index.css) — hardcoded hex here since an
         extension popup can't share the app's CSS bundle, and this is a handful of rules, not
         worth a build step for. */
      body {
        margin: 0;
        width: 320px;
        font-family:
          "IBM Plex Sans",
          -apple-system,
          system-ui,
          sans-serif;
        background: #f3f7f4;
        color: #0e1613;
      }
      header {
        padding: 12px 14px;
        border-bottom: 1px solid #d4e0d8;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0e8f5c;
      }
      main {
        padding: 14px;
      }
      .field {
        margin-bottom: 10px;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #4c5f56;
        margin-bottom: 2px;
      }
      .value {
        font-size: 13px;
        word-break: break-word;
      }
      #confidence.high {
        color: #0e8f5c;
      }
      #confidence.low {
        color: #b45309;
      }
      #url {
        font-size: 11px;
        color: #4c5f56;
        word-break: break-all;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #0e8f5c;
        color: white;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #4c5f56;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <header>🚀 DevRadar Job Clipper</header>
    <main>
      <div class="field">
        <div class="label">Position</div>
        <div class="value" id="title">Detecting…</div>
      </div>
      <div class="field">
        <div class="label">Company</div>
        <div class="value" id="company">—</div>
      </div>
      <div class="field">
        <div class="label" id="confidence">—</div>
      </div>
      <div class="field">
        <div class="label">Page</div>
        <div id="url"></div>
      </div>
      <button id="save" disabled>Save to DevRadar</button>
      <div id="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
