name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No --coverage here isn't a hard gate (no thresholds in vitest.config) — just
      # visibility into real coverage in the CI logs plus an uploaded html/lcov report.
      - name: Test + coverage
        run: pnpm test:coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            client/coverage
            server/coverage
          retention-days: 14

      - name: Build
        run: pnpm build

      - name: Upload build artifacts for E2E
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            client/dist
            server/dist
          retention-days: 1

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking gate — only prod dependencies (what actually ships in the build) and only
      # critical: otherwise a new dev-tooling vulnerability (vite/vitest/eslint) turns main
      # red on an unrelated PR every week. Dependabot already updates these dev deps weekly.
      - name: Audit (prod, critical) — blocking
        run: pnpm audit --prod --audit-level=critical

      # Visibility without blocking: moderate+ across the whole tree (including dev) goes to
      # the CI log but doesn't fail the build. Actual remediation happens via Dependabot or
      # manual review below.
      - name: Audit (all, moderate+) — visibility only
        if: always()
        run: pnpm audit --audit-level=moderate || true

  e2e:
    name: E2E (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
