version: 2
updates:
  # pnpm workspace (root + client + server dependencies are described in the root pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # TypeScript 7 (the native Go compiler) is not yet supported by typescript-eslint
      # (peer-range "<6.1.0"), so the grouped dev-dependencies PR fails CI every time.
      # Remove this ignore once typescript-eslint officially supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
