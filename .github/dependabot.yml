version: 2
updates:
  # pnpm workspace (root + client + server залежності описані в кореневому pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # TypeScript 7 (нативний Go-компілятор) поки не підтримується typescript-eslint
      # (peer-range "<6.1.0"), тож груповий PR з dev-залежностями падає на CI щоразу.
      # Знімемо цей ignore, коли typescript-eslint офіційно підтримає TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
