# Zorya — run with a single command: docker compose up --build
# The app will be available at http://localhost:3001
services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      # Points at the `postgres` service below, not localhost, since containers reach each
      # other by service name on the compose network.
      DATABASE_URL: postgres://jobtrack:jobtrack@postgres:5432/jobtrack
      # LLM (optional) — uncomment and add a key to enable AI features:
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Redis (optional) — only needed once you run more than one `app` replica; a single
      # instance is correct without it (see core/rate-limit.ts). Uncomment together with the
      # `redis` service below.
      # REDIS_URL: redis://redis:6379
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

  postgres:
    # pgvector/pgvector — the official pgvector project image, a drop-in postgres:16 with the
    # `vector` extension binary already installed (a plain postgres:16-alpine image can't
    # `CREATE EXTENSION vector` — the .control/.so files simply aren't present). Needed for
    # per-vacancy embeddings + semantic similarity search (see vacancies.repo.ts#findSimilarVacancies,
    # drizzle/0005_stormy_shocker.sql). Same data directory layout as postgres:16, so the existing
    # `jobtrack-pg` volume survives switching images — no data migration needed, just re-create the
    # container (`docker compose up -d postgres` picks up the new image).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack
      POSTGRES_DB: jobtrack
    ports:
      - "5432:5432"
    volumes:
      - jobtrack-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack -d jobtrack"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  jobtrack-pg:
