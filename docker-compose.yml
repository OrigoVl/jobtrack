# JobTrack — run with a single command: docker compose up --build
# The app will be available at http://localhost:3001
services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_PATH: /app/data/jobtrack.db
      # LLM (optional) — uncomment and add a key to enable AI features:
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - jobtrack-data:/app/data # DB persistence across restarts
    restart: unless-stopped

  # --- Postgres: prepared for a future migration away from node:sqlite ---
  # The app currently runs on the built-in node:sqlite. The service below
  # provides a ready-made DB for the next step (see the "Migration" section in the README).
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: jobtrack
  #     POSTGRES_PASSWORD: jobtrack
  #     POSTGRES_DB: jobtrack
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - jobtrack-pg:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  jobtrack-data:
  # jobtrack-pg:
