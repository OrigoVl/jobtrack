# JobTrack — run with a single command: docker compose up --build
# The app will be available at http://localhost:3001
services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_PATH: /app/data/jobtrack.db
      # Not yet read by the running app (server/src/db/client.ts still talks to node:sqlite) —
      # wired up later in the Postgres migration. Points at the `postgres` service below, not
      # localhost, since containers reach each other by service name on the compose network.
      DATABASE_URL: postgres://jobtrack:jobtrack@postgres:5432/jobtrack
      # LLM (optional) — uncomment and add a key to enable AI features:
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - jobtrack-data:/app/data # DB persistence across restarts
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack
      POSTGRES_DB: jobtrack
    ports:
      - "5432:5432"
    volumes:
      - jobtrack-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack -d jobtrack"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  jobtrack-data:
  jobtrack-pg:
