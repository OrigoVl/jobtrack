<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The app's brand mark (shared/ui.tsx's `Wordmark` sparkle), reversed onto a solid tile: the
       indigo is the `star` token (#4338ca) and the glyph is the light `bg` token (#faf9f6). Both
       are theme-independent in the app itself, so this one file reads fine against a light or dark
       browser chrome and needs no prefers-color-scheme variant. Glyph path copied verbatim from
       `Wordmark`, plus a same-color stroke the on-page mark doesn't have: the sparkle's concave
       waist is thin enough to wash out into the tile at a 16px tab size, and the stroke fattens
       the arms without changing the shape. favicon.ico / apple-touch-icon.png are rasterized from
       this file, so if the mark changes, re-render both from here (ImageMagick):
         for s in 16 32 48; do magick -background none -density 1600 favicon.svg \
           -resize ${s}x${s} -depth 8 -strip png32:/tmp/i$s.png; done
         magick /tmp/i16.png /tmp/i32.png /tmp/i48.png favicon.ico
         magick -background "#4338ca" -density 1600 favicon.svg -flatten -resize 180x180 \
           -depth 8 -strip apple-touch-icon.png
       The apple-touch-icon is flattened onto the tile color on purpose: iOS composites a
       transparent home-screen icon onto black and rounds the corners itself. -->
  <rect width="32" height="32" rx="7" fill="#4338ca" />
  <path
    transform="translate(4.4 4.4) scale(0.9667)"
    fill="#faf9f6"
    stroke="#faf9f6"
    stroke-width="1.3"
    stroke-linejoin="round"
    d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"
  />
</svg>
