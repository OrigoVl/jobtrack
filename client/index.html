<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mirrors light --bg. Not media-keyed to prefers-color-scheme: the app's theme is the
         data-theme attribute (shared/theme.ts), not the OS preference, and a media-keyed value
         here could disagree with what's actually rendered. -->
    <meta name="theme-color" content="#faf9f6" />
    <title>Zorya — a dynamic job-search tracker</title>
    <!-- The brand mark from shared/ui.tsx's `Wordmark`, on an indigo tile (public/favicon.svg, which
         the .ico/.png beside it are rasterized from). The .ico ships alongside the SVG for browsers
         that don't take an SVG icon, and it has to actually exist in the build: a missing
         /favicon.ico wouldn't 404 in production, it would fall through to app.ts's SPA fallback and
         come back as index.html. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Unbounded (display) + Manrope (body) are self-hosted (client/public/fonts/, @font-face in
         src/index.css) — no external Google Fonts request needed. Preload both above-the-fold
         weights. -->
    <link rel="preload" href="/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/unbounded-700.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
